<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na sua conta</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100 text-slate-800">
  <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 sm:p-9 shadow-xl shadow-slate-200/70">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-7 w-7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 7.5a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0A17.9 17.9 0 0 1 12 21.75 17.9 17.9 0 0 1 4.5 20.1Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Bem-vindo de volta</h1>
      <p class="mt-2 text-sm text-slate-500">Entre com seus dados para continuar.</p>
    </div>

    <div class="space-y-4">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="voce@exemplo.com"
          autocomplete="email"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
        >
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
        >
      </div>

      <button
        id="btnLogin"
        type="button"
        class="w-full rounded-xl bg-#A9A9A9 py-3 font-semibold text-white shadow-md shadow-indigo-200 transition duration-200 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200"
      >
        Entrar
      </button>

      <div class="flex items-center gap-3 py-1" aria-hidden="true">
        <div class="h-px flex-1 bg-slate-200"></div>
        <span class="text-xs text-slate-400">AINDA NÃO TEM CONTA?</span>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <button
        id="btnSignup"
        type="button"
        class="w-full rounded-xl border border-slate-300 bg-white py-3 font-semibold text-slate-700 transition duration-200 hover:border-slate-400 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100"
      >
        Criar conta
      </button>
    </div>

    <p id="msg" role="status" aria-live="polite" class="mt-5 min-h-[20px] text-center text-sm text-slate-600"></p>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const supabase = window.supabase.createClient(
      "https://bjaurtrqrasznuptthyf.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqYXVydHJxcmFzem51cHR0aHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDkwNTIsImV4cCI6MjA5MzQ4NTA1Mn0.iCQyvzAJykzgLO4kZkJZ8qNbv3549rG_JuwcVEZDrKA"
    );

    const msg = document.getElementById("msg");

    // ================= LOGIN =================
    document.getElementById("btnLogin").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      msg.className =
        "text-center text-sm mt-4 text-blue-600 min-h-[20px]";

      msg.innerText = "Entrando...";

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error || !data?.user || !data?.session) {
        msg.className =
          "text-center text-sm mt-4 text-red-600 min-h-[20px]";
        msg.innerText = error?.message || "Login inválido";
        return;
      }

      window.location.href = "perfil.html";
    });

    // ================= SIGNUP =================
    document.getElementById("btnSignup").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        msg.innerText = "Senha mínima 6 caracteres";
        return;
      }

      msg.className =
        "text-center text-sm mt-4 text-blue-600 min-h-[20px]";

      msg.innerText = "Criando conta...";

      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });

      if (error) {
        msg.className =
          "text-center text-sm mt-4 text-red-600 min-h-[20px]";
        msg.innerText = error.message;
        return;
      }

      // ⚠️ IMPORTANTE: usuário pode não estar confirmado dependendo do Supabase
      if (!data?.user) {
        msg.innerText = "Verifique seu email para confirmar a conta.";
        return;
      }

      msg.className =
        "text-center text-sm mt-4 text-green-600 min-h-[20px]";

      msg.innerText =
        "Conta criada! Verifique seu email ou clique em entrar.";
    });

  });
  </script>
</body>
</html>
