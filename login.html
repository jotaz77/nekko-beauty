<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na sua conta</title>
  <link rel="icon" type="image/png" href="img/estetika.png">
  <link rel="apple-touch-icon" href="nekko-beauty/img/estetika.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-[#d1d1d1] text-[#45433f]">
  <main class="w-full max-w-md rounded-2xl border border-[#545454] bg-[#ffffff] p-7 sm:p-9 shadow-xl shadow-[#545454]/30">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center overflow-hidden rounded-2xl border border-[#bdbdbd] bg-[#e0e0e0] shadow-sm" aria-hidden="true">
        <img src="img/estetika.png" alt="" class="h-full w-full object-contain" onerror="this.style.display='none'">
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-[#393939]">Bem-vindo de volta</h1>
      <p class="mt-2 text-sm text-[#707070]">Entre com seus dados para continuar.</p>
    </div>

    <div class="space-y-4">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-[#555555]">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="voce@exemplo.com"
          autocomplete="email"
          class="w-full rounded-xl border border-[#bdbdbd] bg-white px-4 py-3 text-[#393939] placeholder:text-[#929292] outline-none transition focus:border-[#666666] focus:ring-4 focus:ring-[#e0e0e0]"
        >
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-[#555555]">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          class="w-full rounded-xl border border-[#bdbdbd] bg-white px-4 py-3 text-[#393939] placeholder:text-[#929292] outline-none transition focus:border-[#666666] focus:ring-4 focus:ring-[#e0e0e0]"
        >
      </div>

      <button
        id="btnLogin"
        type="button"
        class="w-full rounded-xl bg-[#666666] py-3 font-semibold text-white shadow-md shadow-[#545454]/30 transition duration-200 hover:bg-[#4d4d4d] focus:outline-none focus:ring-4 focus:ring-[#d1d1d1]"
      >
        Entrar
      </button>

      <div class="flex items-center gap-3 py-1" aria-hidden="true">
        <div class="h-px flex-1 bg-[#c9c9c9]"></div>
        <span class="text-xs text-[#777777]">AINDA NÃO TEM CONTA?</span>
        <div class="h-px flex-1 bg-[#c9c9c9]"></div>
      </div>

      <button
        id="btnSignup"
        type="button"
        class="w-full rounded-xl border border-[#666666] bg-[#e0e0e0] py-3 font-semibold text-[#45433f] transition duration-200 hover:border-[#545454] hover:bg-[#d1d1d1] focus:outline-none focus:ring-4 focus:ring-[#e0e0e0]"
      >
        Criar conta
      </button>
    </div>

    <p id="msg" role="status" aria-live="polite" class="mt-5 min-h-[20px] text-center text-sm text-[#666666]"></p>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const supabase = window.supabase.createClient(
      "https://bjaurtrqrasznuptthyf.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqYXVydHJxcmFzem51cHR0aHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDkwNTIsImV4cCI6MjA5MzQ4NTA1Mn0.iCQyvzAJykzgLO4kZkJZ8qNbv3549rG_JuwcVEZDrKA"
    );

    const msg = document.getElementById("msg");

    // ================= LOGIN =================
    document.getElementById("btnLogin").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      msg.className =
        "text-center text-sm mt-4 text-[#555555] min-h-[20px]";

      msg.innerText = "Entrando...";

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error || !data?.user || !data?.session) {
        msg.className =
          "text-center text-sm mt-4 text-[#b4534b] min-h-[20px]";
        msg.innerText = error?.message || "Login inválido";
        return;
      }

      window.location.href = "perfil.html";
    });

    // ================= SIGNUP =================
    document.getElementById("btnSignup").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        msg.innerText = "Senha mínima 6 caracteres";
        return;
      }

      msg.className =
        "text-center text-sm mt-4 text-[#555555] min-h-[20px]";

      msg.innerText = "Criando conta...";

      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });

      if (error) {
        msg.className =
          "text-center text-sm mt-4 text-[#b4534b] min-h-[20px]";
        msg.innerText = error.message;
        return;
      }

      // ⚠️ IMPORTANTE: usuário pode não estar confirmado dependendo do Supabase
      if (!data?.user) {
        msg.innerText = "Verifique seu email para confirmar a conta.";
        return;
      }

      msg.className =
        "text-center text-sm mt-4 text-[#657b5a] min-h-[20px]";

      msg.innerText =
        "Conta criada! Verifique seu email ou clique em entrar.";
    });

  });
  </script>
</body>
</html>
